name: Implement auto book sharding temporary

on:
  push:
    branches:
      - feat/auto-yuque-book-sharding
    paths:
      - .github/workflows/implement-auto-book-sharding-temporary.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/auto-yuque-book-sharding
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply patch
        run: python .github/auto-book-patch.py
      - name: Prepare 1.3.3
        run: npm version 1.3.3 --no-git-tag-version
      - name: Install locked dependencies
        run: npm ci
      - name: Run full project checks
        run: npm run check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.ts src tests README.md package.json package-lock.json manifest.json versions.json
          git commit -m "功能：使用 Token 自动创建并分片语雀知识库"
          git push
