name: Bump 1.3.0 temporary

on:
  push:
    branches: [feat/incremental-sync-index]

permissions:
  contents: write

concurrency:
  group: bump-1-3-0-temporary
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/incremental-sync-index
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bump version metadata
        run: npm version 1.3.0 --no-git-tag-version
      - run: npm run check
      - name: Verify version consistency
        run: node -e "const p=require('./package.json');const m=require('./manifest.json');const v=require('./versions.json');if(p.version!=='1.3.0'||m.version!=='1.3.0'||v['1.3.0']!==m.minAppVersion){throw new Error('1.3.0 版本元数据不一致')}"
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "发布：准备 1.3.0"
          git push
