name: Modernize dependencies

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: yuque-sync-modernize-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  modernize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install modernized dependencies
        run: npm ci

      - name: Lint, typecheck and build
        run: npm run check

      - name: Check latest Obsidian API
        run: |
          npm install --no-save --package-lock=false obsidian@latest
          node -e "console.log('obsidian-api', require('obsidian/package.json').version)"
          npm run typecheck

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "构建：更新现代化依赖锁文件"
          git push
