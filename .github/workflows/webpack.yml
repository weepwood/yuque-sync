name: Build and Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: yuque-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install > npm-install.log 2>&1

      - name: Typecheck and build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build > build.log 2>&1

      - name: Report diagnostics to pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- yuque-sync-ci-diagnostic -->';
            const readTail = (path) => fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8').slice(-8000)
              : '(没有生成日志文件)';
            const installOutcome = '${{ steps.install.outcome }}';
            const buildOutcome = '${{ steps.build.outcome }}';
            const body = `${marker}\n## 构建诊断\n\n- 依赖安装：${installOutcome}\n- 类型检查与构建：${buildOutcome}\n\n<details><summary>安装日志</summary>\n\n\`\`\`text\n${readTail('npm-install.log')}\n\`\`\`\n</details>\n\n<details><summary>构建日志</summary>\n\n\`\`\`text\n${readTail('build.log')}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuque-sync-diagnostics-${{ github.sha }}
          path: |
            npm-install.log
            build.log
          if-no-files-found: warn

      - name: Print failure details
        if: steps.install.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          test -f npm-install.log && cat npm-install.log || true
          test -f build.log && cat build.log || true
          exit 1

      - name: Verify build output
        run: test -s main.js

      - name: Verify release versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const p=require('./package.json');const m=require('./manifest.json');const tag=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(p.version!==m.version||p.version!==tag){throw new Error('package.json、manifest.json 与标签版本不一致')}"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuque-sync-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
