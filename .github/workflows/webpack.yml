name: Build and Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: yuque-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci 2>&1 | tee npm-install.log

      - name: Typecheck and build
        run: npm run build 2>&1 | tee build.log

      - name: Verify build output
        run: test -s main.js

      - name: Verify release versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const p=require('./package.json');const m=require('./manifest.json');const tag=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(p.version!==m.version||p.version!==tag){throw new Error('package.json、manifest.json 与标签版本不一致')}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuque-sync-diagnostics-${{ github.sha }}
          path: |
            npm-install.log
            build.log
          if-no-files-found: ignore

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuque-sync-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
