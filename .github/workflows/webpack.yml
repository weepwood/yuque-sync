name: Modernize dependencies

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: yuque-sync-modernize-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  modernize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Apply source modernization fixes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'main.ts';
          const original = readFileSync(path, 'utf8');
          let updated = original.replace(
            'settings: YuqueSyncSettings = { ...DEFAULT_SETTINGS };',
            'pluginSettings: YuqueSyncSettings = { ...DEFAULT_SETTINGS };',
          );
          updated = updated.replaceAll('this.settings', 'this.pluginSettings');
          updated = updated.replaceAll(
            'processFrontMatter(file, (metadata) => {',
            'processFrontMatter(file, (metadata: Record<string, unknown>) => {',
          );
          if (updated === original) {
            throw new Error('Expected modernization replacements were not found');
          }
          writeFileSync(path, updated);
          NODE

      - name: Rebuild package lock from scratch
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts

      - name: Install modernized dependencies
        run: npm ci

      - name: Lint, typecheck and build
        run: npm run check

      - name: Check latest Obsidian API
        run: |
          npm install --no-save --package-lock=false obsidian@latest
          node -e "console.log('obsidian-api', require('obsidian/package.json').version)"
          npm run typecheck

      - name: Commit modernization fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.ts package-lock.json
          if git diff --cached --quiet; then
            echo "Modernization files are already current"
            exit 0
          fi
          git commit -m "构建：完成依赖现代化适配"
          git push
