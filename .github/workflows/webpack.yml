name: Build, Compatibility and Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: yuque-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install locked dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Verify plugin files
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css

  obsidian-compatibility:
    name: Latest Obsidian API compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install locked dependencies
        run: npm ci

      - name: Install latest Obsidian API types
        run: npm install --no-save --package-lock=false obsidian@latest

      - name: Show Obsidian API version
        run: node -e "console.log('obsidian-api', require('obsidian/package.json').version)"

      - name: Typecheck against latest Obsidian API
        run: npm run typecheck

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, obsidian-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install locked dependencies
        run: npm ci

      - name: Read and verify release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node -e "const p=require('./package.json');const m=require('./manifest.json');const v=require('./versions.json');if(p.version!==m.version){throw new Error('package.json 与 manifest.json 版本不一致')}if(v[p.version]!==m.minAppVersion){throw new Error('versions.json 与 manifest.json 的最低版本不一致')}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release files
        if: steps.release_check.outputs.exists != 'true'
        run: npm run build

      - name: Verify release files
        if: steps.release_check.outputs.exists != 'true'
        run: |
          test -s main.js
          test -s manifest.json
          test -s styles.css

      - name: Create tag and GitHub Release
        if: steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            main.js manifest.json styles.css \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
