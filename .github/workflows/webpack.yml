name: Build and Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: yuque-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install > npm-install.log 2>&1

      - name: Typecheck and build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build > build.log 2>&1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuque-sync-diagnostics-${{ github.sha }}
          path: |
            npm-install.log
            build.log
          if-no-files-found: warn

      - name: Print failure details
        if: steps.install.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          test -f npm-install.log && cat npm-install.log || true
          test -f build.log && cat build.log || true
          exit 1

      - name: Verify build output
        run: test -s main.js

      - name: Verify release versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const p=require('./package.json');const m=require('./manifest.json');const tag=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(p.version!==m.version||p.version!==tag){throw new Error('package.json、manifest.json 与标签版本不一致')}"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuque-sync-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
