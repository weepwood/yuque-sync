name: Build and Package npm Project

on:
  push:
    branches:
      - main # 触发条件：当代码推送到 main 分支时触发
  pull_request:
    branches:
      - main # 触发条件：当向 main 分支发起 Pull Request 时触发

jobs:
  build:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 环境

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18 # 指定 Node.js 版本

      # 安装依赖
      - name: Install dependencies
        run: npm install

      # 打包项目
      - name: Build project
        run: npm run build

      # （可选）上传打包结果作为构建产物
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-output
          path: dist/ # 假设打包结果存放在 dist 目录
