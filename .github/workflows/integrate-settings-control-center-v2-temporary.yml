name: Integrate settings control center v2 temporary

on:
  push:
    branches: [feat/yuque-api-rate-limiter]

permissions:
  contents: write

concurrency:
  group: integrate-settings-control-center-v2-temporary
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/yuque-api-rate-limiter
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply settings integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'anchor missing: {path}: {old[:50]!r}')
              p.write_text(s.replace(old, new, 1))

          rep('src/types.ts', '\tscanSession: ScanSession | null;\n\tremoteCheckTtlHours: number;', '\tscanSession: ScanSession | null;\n\tlastScanSummary: ScanSummary | null;\n\tremoteCheckTtlHours: number;')
          rep('src/types.ts', '\tscanSession: null,\n\tremoteCheckTtlHours: 24,', '\tscanSession: null,\n\tlastScanSummary: null,\n\tremoteCheckTtlHours: 24,')
          rep('src/sync-engine.ts', '\tcancelScan(): boolean {\n\t\tif (!this.scanning) {', '\tisScanning(): boolean {\n\t\treturn this.scanning;\n\t}\n\n\tcancelScan(): boolean {\n\t\tif (!this.scanning) {')

          rep('src/settings-tab.ts', "import { DEFAULT_SETTINGS, type YuqueSyncSettings } from './types';\n\nexport interface SettingsHost {\n\tpluginSettings: YuqueSyncSettings;\n\tsaveSettings(): Promise<void>;\n}", "import { SyncSettingsPanel, type SyncSettingsHost } from './sync-settings-panel';\nimport { DEFAULT_SETTINGS, type YuqueSyncSettings } from './types';\n\nexport interface SettingsHost extends SyncSettingsHost {\n\tpluginSettings: YuqueSyncSettings;\n\tsaveSettings(): Promise<void>;\n}")
          rep('src/settings-tab.ts', 'export class YuqueSyncSettingTab extends PluginSettingTab {\n\tprivate saveTimer: number | null = null;', 'export class YuqueSyncSettingTab extends PluginSettingTab {\n\tprivate saveTimer: number | null = null;\n\tprivate syncPanel: SyncSettingsPanel | null = null;')
          rep('src/settings-tab.ts', '\t\tconst { containerEl } = this;\n\t\tcontainerEl.empty();', '\t\tconst { containerEl } = this;\n\t\tthis.syncPanel?.dispose();\n\t\tthis.syncPanel = null;\n\t\tcontainerEl.empty();')
          rep('src/settings-tab.ts', '\t\tthis.renderRateLimitSettings(containerEl);\n\n\t\tnew Setting(containerEl)', '\t\tthis.syncPanel = new SyncSettingsPanel(this.app, this.host, () => this.display());\n\t\tthis.syncPanel.render(containerEl);\n\n\t\tthis.renderRateLimitSettings(containerEl);\n\n\t\tnew Setting(containerEl)')
          rep('src/settings-tab.ts', '\thide(): void {\n\t\tif (this.saveTimer !== null) {', '\thide(): void {\n\t\tthis.syncPanel?.dispose();\n\t\tthis.syncPanel = null;\n\t\tif (this.saveTimer !== null) {')

          main = Path('main.ts')
          s = main.read_text().replace("import { SyncStatusModal } from './src/sync-status-modal';\n", '')
          old = '\t\t\tscanSession: saved?.scanSession ?? null,\n\t\t\tremoteCheckTtlHours: saved?.remoteCheckTtlHours ?? DEFAULT_SETTINGS.remoteCheckTtlHours,'
          new = '\t\t\tscanSession: saved?.scanSession ?? null,\n\t\t\tlastScanSummary: saved?.lastScanSummary ?? null,\n\t\t\tremoteCheckTtlHours: saved?.remoteCheckTtlHours ?? DEFAULT_SETTINGS.remoteCheckTtlHours,'
          if old not in s: raise SystemExit('main load settings anchor missing')
          s = s.replace(old, new, 1)
          old = '\tasync saveSettings(): Promise<void> {\n\t\tawait this.saveData(this.pluginSettings);\n\t}\n'
          new = ''.join([
              '\tasync saveSettings(): Promise<void> {\n\t\tawait this.saveData(this.pluginSettings);\n\t}\n\n',
              '\tasync runSettingsScan(mode: ScanMode): Promise<void> {\n\t\tawait this.runExclusive(\n\t\t\tmode === \'full\' ? \'正在完整检测同步状态\' : \'正在增量检测同步状态\',\n\t\t\t() => this.scanDocumentsAndShow(mode),\n\t\t);\n\t}\n\n',
              '\tasync runSettingsPushUnlinked(): Promise<void> {\n\t\tawait this.runExclusive(\'正在批量推送文档\', () => this.pushUnlinkedDocuments());\n\t}\n\n',
              '\tcancelSettingsScan(): boolean {\n\t\treturn this.syncEngine.cancelScan();\n\t}\n\n',
              '\tisSettingsScanRunning(): boolean {\n\t\treturn this.syncEngine.isScanning();\n\t}\n'
          ])
          if old not in s: raise SystemExit('main saveSettings anchor missing')
          s = s.replace(old, new, 1)
          start = s.find('\tprivate async scanDocumentsAndShow(mode: ScanMode): Promise<void> {')
          end = s.find('\tprivate async pushUnlinkedDocuments(): Promise<void> {', start)
          if start < 0 or end < 0: raise SystemExit('scan method range missing')
          replacement = ''.join([
              '\tprivate async scanDocumentsAndShow(mode: ScanMode): Promise<void> {\n',
              '\t\tthis.requireToken();\n',
              '\t\tif (mode === \'full\') {\n',
              '\t\t\tconst total = this.app.vault.getMarkdownFiles().filter((file) => !this.isManagedBackupFile(file)).length;\n',
              '\t\t\tconst confirmed = await ConfirmModal.show(\n\t\t\t\tthis.app,\n\t\t\t\t\'执行完整同步检测？\',\n\t\t\t\t`将深度校验 ${total} 篇 Markdown。完整检测会下载所有已关联语雀文档正文；任务支持暂停和断点继续。`,\n\t\t\t);\n',
              '\t\t\tif (!confirmed) return;\n\t\t}\n\n',
              '\t\tconst report = await this.syncEngine.scan(mode);\n',
              '\t\tthis.pluginSettings.lastScanSummary = report.summary;\n',
              '\t\tawait this.saveSettings();\n\n',
              '\t\tconst message = report.summary.canceled\n',
              '\t\t\t? `检测已暂停：本次处理 ${report.summary.scanned} 篇，进度已保存，可在设置 → Yuque Sync 查看`\n',
              '\t\t\t: `检测完成：实际处理 ${report.summary.scanned} 篇，复用缓存 ${report.summary.cached} 篇，远端正文请求 ${report.summary.remoteBodyRequests} 次；结果已更新到设置页`;\n',
              '\t\tnew Notice(message);\n\t\tthis.setStatus(message, 5000);\n\t}\n'
          ])
          s = s[:start] + replacement + s[end:]
          main.write_text(s)

          styles = Path('styles.css')
          s = styles.read_text().replace('/* Scan modal */', '/* Sync status panel */')
          if '.yuque-sync-settings-scan-metrics' not in s:
              s += '\n.yuque-sync-settings-scan-metrics {\n\tmargin-top: var(--size-4-3);\n}\n\n.yuque-sync-settings-actions {\n\tmargin-bottom: var(--size-4-3);\n}\n\n.yuque-sync-settings-table-wrap {\n\tmax-height: min(52vh, 620px);\n\tmargin-bottom: var(--size-4-5);\n}\n\n.yuque-sync-control-busy {\n\tborder-left: 3px solid var(--interactive-accent);\n}\n'
          styles.write_text(s)

          readme = Path('README.md')
          s = readme.read_text()
          if '## 设置页同步控制中心' not in s:
              anchor = '## 语雀 OpenAPI 主动限流\n'
              if anchor not in s: raise SystemExit('README anchor missing')
              note = '## 设置页同步控制中心\n\n同步状态不再通过单独弹窗展示。插件设置页现在直接提供增量检测、完整检测、暂停检测、批量推送未关联文档、状态概览、搜索筛选和文档列表。同步索引会持久化，重启 Obsidian 后仍可在设置页查看当前状态；最近一次扫描摘要也会保留。\n\n'
              s = s.replace(anchor, note + anchor, 1)
          readme.write_text(s)
          PY
      - run: npm ci
      - run: npm run check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.ts src/types.ts src/sync-engine.ts src/settings-tab.ts src/sync-settings-panel.ts styles.css README.md
          if git diff --cached --quiet; then
            echo "No integration changes"
            exit 0
          fi
          git commit -m "界面：将同步状态整合到设置页"
          git push
