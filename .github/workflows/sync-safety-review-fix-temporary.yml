name: Sync safety review fix temporary

on:
  push:
    branches: [feat/sync-safety-cancel-tests]
    paths:
      - .github/workflows/sync-safety-review-fix-temporary.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/sync-safety-cancel-tests
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Harden dispose and extend tests
        run: |
          python - <<'PY'
          from pathlib import Path

          rate = Path('src/api-rate-limiter.ts')
          s = rate.read_text()
          s = s.replace(
              "\t\t\t\t.then(request.resolve, (error: unknown) => {\n\t\t\t\t\tif (this.isRateLimitError(error)) {",
              "\t\t\t\t.then(request.resolve, (error: unknown) => {\n\t\t\t\t\tif (!this.disposed && this.isRateLimitError(error)) {",
              1,
          )
          s = s.replace(
              "\tprivate pauseForRateLimit(error: unknown): void {\n\t\tconst now = Date.now();",
              "\tprivate pauseForRateLimit(error: unknown): void {\n\t\tif (this.disposed) return;\n\t\tconst now = Date.now();",
              1,
          )
          s = s.replace(
              "\tprivate scheduleWake(waitMs: number): void {\n\t\tconst safeWait = Math.max(20, Math.ceil(waitMs));",
              "\tprivate scheduleWake(waitMs: number): void {\n\t\tif (this.disposed) return;\n\t\tconst safeWait = Math.max(20, Math.ceil(waitMs));",
              1,
          )
          s = s.replace(
              "\tprivate schedulePersist(): void {\n\t\tif (this.persistTimer !== null) {",
              "\tprivate schedulePersist(): void {\n\t\tif (this.disposed || this.persistTimer !== null) {",
              1,
          )
          rate.write_text(s)

          test_path = Path('tests/api-rate-limiter.test.ts')
          test = test_path.read_text()
          insert = r'''

  it('enforces the one-minute sliding window', async () => {
    vi.useFakeTimers();
    vi.setSystemTime(new Date('2026-08-11T00:00:00Z'));
    const state = settings({ apiRatePerSecond: 100, apiRatePerMinute: 2, apiRatePerHour: 1000 });
    const limiter = new YuqueApiRateLimiter(() => state, async () => undefined, () => undefined);
    const calls: number[] = [];
    const jobs = [1, 2, 3].map((value) => limiter.schedule(async () => {
      calls.push(value);
      return value;
    }));

    await vi.advanceTimersByTimeAsync(0);
    expect(calls).toEqual([1, 2]);
    await vi.advanceTimersByTimeAsync(60_025);
    await expect(Promise.all(jobs)).resolves.toEqual([1, 2, 3]);
    limiter.dispose();
  });

  it('enforces the one-hour sliding window', async () => {
    vi.useFakeTimers();
    vi.setSystemTime(new Date('2026-08-11T00:00:00Z'));
    const state = settings({ apiRatePerSecond: 100, apiRatePerMinute: 100, apiRatePerHour: 2 });
    const limiter = new YuqueApiRateLimiter(() => state, async () => undefined, () => undefined);
    const calls: number[] = [];
    const jobs = [1, 2, 3].map((value) => limiter.schedule(async () => {
      calls.push(value);
      return value;
    }));

    await vi.advanceTimersByTimeAsync(0);
    expect(calls).toEqual([1, 2]);
    await vi.advanceTimersByTimeAsync(3_600_025);
    await expect(Promise.all(jobs)).resolves.toEqual([1, 2, 3]);
    limiter.dispose();
  });

  it('pauses the whole queue according to Retry-After after a 429', async () => {
    vi.useFakeTimers();
    vi.setSystemTime(new Date('2026-08-11T00:00:00Z'));
    const state = settings({ apiRatePerSecond: 100, apiRatePerMinute: 100, apiRatePerHour: 1000 });
    const limiter = new YuqueApiRateLimiter(() => state, async () => undefined, () => undefined);

    await expect(limiter.schedule(async () => {
      throw { status: 429, headers: { 'Retry-After': '2' } };
    })).rejects.toMatchObject({ status: 429 });

    let ran = false;
    const queued = limiter.schedule(async () => {
      ran = true;
      return 'ok';
    });
    await vi.advanceTimersByTimeAsync(0);
    expect(ran).toBe(false);
    await vi.advanceTimersByTimeAsync(2_025);
    await expect(queued).resolves.toBe('ok');
    limiter.dispose();
  });

  it('does not re-arm 429 timers after dispose', async () => {
    vi.useFakeTimers();
    vi.setSystemTime(new Date('2026-08-11T00:00:00Z'));
    const state = settings({ apiRatePerSecond: 100, apiRatePerMinute: 100, apiRatePerHour: 1000 });
    const limiter = new YuqueApiRateLimiter(() => state, async () => undefined, () => undefined);
    let rejectActive: ((reason: unknown) => void) | undefined;
    const active = limiter.schedule(() => new Promise<string>((_resolve, reject) => {
      rejectActive = reject;
    }));
    await vi.advanceTimersByTimeAsync(0);
    limiter.dispose();
    rejectActive?.({ status: 429, headers: { 'Retry-After': '30' } });
    await expect(active).rejects.toMatchObject({ status: 429 });
    expect(state.apiPausedUntil).toBe(0);
    expect(vi.getTimerCount()).toBe(0);
  });
'''
          marker = "\n  it('removes an aborted queued scan request'"
          if marker not in test:
              raise SystemExit('test insertion marker missing')
          test_path.write_text(test.replace(marker, insert + marker, 1))
          PY
      - run: npm ci
      - run: npm run check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api-rate-limiter.ts tests/api-rate-limiter.test.ts
          git commit -m "测试：覆盖多窗口限流与卸载生命周期"
          git push
