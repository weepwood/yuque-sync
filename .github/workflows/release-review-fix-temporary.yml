name: Release review fix temporary

on:
  push:
    branches: [feat/yuque-api-rate-limiter]

permissions:
  contents: write

concurrency:
  group: release-review-fix-temporary
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/yuque-api-rate-limiter
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Remove unverified quota comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/settings-tab.ts')
          s = p.read_text()
          old = '请求历史会跨 Obsidian 重启持久化。插件默认 4000 次/小时，低于公开资料常见的 5000 次/小时限制。'
          new = '请求历史会跨 Obsidian 重启持久化。插件默认 4000 次/小时，这是保守安全值；请按语雀官方 OpenAPI 页面当前额度调整。'
          if old not in s:
              raise SystemExit('target copy not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/settings-tab.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "文案：移除未经核实的 API 配额比较"
          git push
