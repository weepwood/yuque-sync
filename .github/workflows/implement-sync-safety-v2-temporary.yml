name: Implement sync safety v2 temporary

on:
  push:
    branches: [feat/sync-safety-cancel-tests]
    paths:
      - .github/workflows/implement-sync-safety-v2-temporary.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/sync-safety-cancel-tests
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Include tests in TypeScript project
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('tsconfig.json')
          data = json.loads(path.read_text())
          include = data.setdefault('include', [])
          if 'tests/**/*.ts' not in include:
              include.append('tests/**/*.ts')
          path.write_text(json.dumps(data, ensure_ascii=False, indent='\t') + '\n')
          PY
      - name: Replay implementation steps
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import subprocess
          import yaml

          workflow = yaml.safe_load(open('.github/workflows/implement-sync-safety-temporary.yml'))
          steps = workflow['jobs']['implement']['steps']
          wanted = {
              'Apply safety and cancellation changes',
              'Add automated tests',
              'Install test dependency and prepare 1.3.2',
              'Run checks',
          }
          for step in steps:
              if step.get('name') not in wanted:
                  continue
              print(f"::group::{step['name']}")
              subprocess.run(step['run'], shell=True, check=True, executable='/bin/bash')
              print('::endgroup::')
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.ts src package.json package-lock.json manifest.json versions.json tests tsconfig.json
          git commit -m "安全：增加覆盖冲突保护与可取消 API 队列"
          git push
