name: Implement sync safety v4 temporary

on:
  push:
    branches: [feat/sync-safety-cancel-tests]
    paths:
      - .github/workflows/implement-sync-safety-v4-temporary.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/sync-safety-cancel-tests
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Prepare project and replay implementation
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import json
          import subprocess
          import yaml
          from pathlib import Path

          tsconfig = Path('tsconfig.json')
          data = json.loads(tsconfig.read_text())
          include = data.setdefault('include', [])
          if 'tests/**/*.ts' not in include:
              include.append('tests/**/*.ts')
          tsconfig.write_text(json.dumps(data, ensure_ascii=False, indent='\t') + '\n')

          workflow = yaml.safe_load(open('.github/workflows/implement-sync-safety-temporary.yml'))
          steps = workflow['jobs']['implement']['steps']
          by_name = {step.get('name'): step for step in steps}
          for name in [
              'Apply safety and cancellation changes',
              'Add automated tests',
              'Install test dependency and prepare 1.3.2',
          ]:
              subprocess.run(by_name[name]['run'], shell=True, check=True, executable='/bin/bash')

          for file_name in ['src/api-rate-limiter.ts', 'src/sync-engine.ts']:
              path = Path(file_name)
              path.write_text(path.read_text().replace('globalThis.setTimeout', 'window.setTimeout').replace('globalThis.clearTimeout', 'window.clearTimeout'))

          test_path = Path('tests/api-rate-limiter.test.ts')
          test = test_path.read_text()
          test = test.replace(
              "import { afterEach, describe, expect, it, vi } from 'vitest';",
              "import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';",
              1,
          )
          marker = "afterEach(() => {\n  vi.useRealTimers();\n});"
          replacement = "beforeEach(() => {\n  Object.defineProperty(globalThis, 'window', { value: globalThis, configurable: true });\n});\n\nafterEach(() => {\n  vi.useRealTimers();\n  Reflect.deleteProperty(globalThis, 'window');\n});"
          if marker not in test:
              raise SystemExit('test lifecycle marker not found')
          test_path.write_text(test.replace(marker, replacement, 1))
          PY
      - name: Run checks
        run: npm run check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.ts src package.json package-lock.json manifest.json versions.json tests tsconfig.json
          git commit -m "安全：增加覆盖冲突保护与可取消 API 队列"
          git push
