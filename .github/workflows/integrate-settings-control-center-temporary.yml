name: Integrate settings control center temporary

on:
  push:
    branches: [feat/yuque-api-rate-limiter]

permissions:
  contents: write

concurrency:
  group: integrate-settings-control-center-temporary
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/yuque-api-rate-limiter
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply settings integration
        run: |
          python - <<'PY'
          from pathlib import Path

          types = Path('src/types.ts')
          s = types.read_text()
          old = "\tscanSession: ScanSession | null;\n\tremoteCheckTtlHours: number;"
          new = "\tscanSession: ScanSession | null;\n\tlastScanSummary: ScanSummary | null;\n\tremoteCheckTtlHours: number;"
          if old not in s: raise SystemExit('types settings anchor missing')
          s = s.replace(old, new, 1)
          old = "\tscanSession: null,\n\tremoteCheckTtlHours: 24,"
          new = "\tscanSession: null,\n\tlastScanSummary: null,\n\tremoteCheckTtlHours: 24,"
          if old not in s: raise SystemExit('types defaults anchor missing')
          s = s.replace(old, new, 1)
          types.write_text(s)

          engine = Path('src/sync-engine.ts')
          s = engine.read_text()
          old = "\tcancelScan(): boolean {\n\t\tif (!this.scanning) {"
          new = "\tisScanning(): boolean {\n\t\treturn this.scanning;\n\t}\n\n\tcancelScan(): boolean {\n\t\tif (!this.scanning) {"
          if old not in s: raise SystemExit('engine cancel anchor missing')
          s = s.replace(old, new, 1)
          engine.write_text(s)

          settings = Path('src/settings-tab.ts')
          s = settings.read_text()
          old = "import { DEFAULT_SETTINGS, type YuqueSyncSettings } from './types';\n\nexport interface SettingsHost {\n\tpluginSettings: YuqueSyncSettings;\n\tsaveSettings(): Promise<void>;\n}"
          new = "import { SyncSettingsPanel, type SyncSettingsHost } from './sync-settings-panel';\nimport { DEFAULT_SETTINGS, type YuqueSyncSettings } from './types';\n\nexport interface SettingsHost extends SyncSettingsHost {\n\tpluginSettings: YuqueSyncSettings;\n\tsaveSettings(): Promise<void>;\n}"
          if old not in s: raise SystemExit('settings imports anchor missing')
          s = s.replace(old, new, 1)
          old = "export class YuqueSyncSettingTab extends PluginSettingTab {\n\tprivate saveTimer: number | null = null;"
          new = "export class YuqueSyncSettingTab extends PluginSettingTab {\n\tprivate saveTimer: number | null = null;\n\tprivate syncPanel: SyncSettingsPanel | null = null;"
          if old not in s: raise SystemExit('settings class anchor missing')
          s = s.replace(old, new, 1)
          old = "\t\tconst { containerEl } = this;\n\t\tcontainerEl.empty();"
          new = "\t\tconst { containerEl } = this;\n\t\tthis.syncPanel?.dispose();\n\t\tthis.syncPanel = null;\n\t\tcontainerEl.empty();"
          if old not in s: raise SystemExit('settings display anchor missing')
          s = s.replace(old, new, 1)
          old = "\t\tthis.renderRateLimitSettings(containerEl);\n\n\t\tnew Setting(containerEl)"
          new = "\t\tthis.syncPanel = new SyncSettingsPanel(this.app, this.host, () => this.display());\n\t\tthis.syncPanel.render(containerEl);\n\n\t\tthis.renderRateLimitSettings(containerEl);\n\n\t\tnew Setting(containerEl)"
          if old not in s: raise SystemExit('settings panel insertion anchor missing')
          s = s.replace(old, new, 1)
          old = "\thide(): void {\n\t\tif (this.saveTimer !== null) {"
          new = "\thide(): void {\n\t\tthis.syncPanel?.dispose();\n\t\tthis.syncPanel = null;\n\t\tif (this.saveTimer !== null) {"
          if old not in s: raise SystemExit('settings hide anchor missing')
          s = s.replace(old, new, 1)
          settings.write_text(s)

          main = Path('main.ts')
          s = main.read_text()
          s = s.replace("import { SyncStatusModal } from './src/sync-status-modal';\n", "")
          old = "\t\t\tscanSession: saved?.scanSession ?? null,\n\t\t\tremoteCheckTtlHours: saved?.remoteCheckTtlHours ?? DEFAULT_SETTINGS.remoteCheckTtlHours,"
          new = "\t\t\tscanSession: saved?.scanSession ?? null,\n\t\t\tlastScanSummary: saved?.lastScanSummary ?? null,\n\t\t\tremoteCheckTtlHours: saved?.remoteCheckTtlHours ?? DEFAULT_SETTINGS.remoteCheckTtlHours,"
          if old not in s: raise SystemExit('main load settings anchor missing')
          s = s.replace(old, new, 1)
          old = "\tasync saveSettings(): Promise<void> {\n\t\tawait this.saveData(this.pluginSettings);\n\t}\n"
          new = """\tasync saveSettings(): Promise<void> {\n\t\tawait this.saveData(this.pluginSettings);\n\t}\n\n\tasync runSettingsScan(mode: ScanMode): Promise<void> {\n\t\tawait this.runExclusive(\n\t\t\tmode === 'full' ? '正在完整检测同步状态' : '正在增量检测同步状态',\n\t\t\t() => this.scanDocumentsAndShow(mode),\n\t\t);\n\t}\n\n\tasync runSettingsPushUnlinked(): Promise<void> {\n\t\tawait this.runExclusive('正在批量推送文档', () => this.pushUnlinkedDocuments());\n\t}\n\n\tcancelSettingsScan(): boolean {\n\t\treturn this.syncEngine.cancelScan();\n\t}\n\n\tisSettingsScanRunning(): boolean {\n\t\treturn this.syncEngine.isScanning();\n\t}\n"""
          if old not in s: raise SystemExit('main save settings anchor missing')
          s = s.replace(old, new, 1)
          start = s.find("\tprivate async scanDocumentsAndShow(mode: ScanMode): Promise<void> {")
          end = s.find("\tprivate async pushUnlinkedDocuments(): Promise<void> {", start)
          if start < 0 or end < 0: raise SystemExit('main scan method range missing')
          replacement = """\tprivate async scanDocumentsAndShow(mode: ScanMode): Promise<void> {\n\t\tthis.requireToken();\n\t\tif (mode === 'full') {\n\t\t\tconst total = this.app.vault.getMarkdownFiles().filter((file) => !this.isManagedBackupFile(file)).length;\n\t\t\tconst confirmed = await ConfirmModal.show(\n\t\t\t\tthis.app,\n\t\t\t\t'执行完整同步检测？',\n\t\t\t\t`将深度校验 ${total} 篇 Markdown。完整检测会下载所有已关联语雀文档正文；任务支持暂停和断点继续。`,\n\t\t\t);\n\t\t\tif (!confirmed) {\n\t\t\t\treturn;\n\t\t\t}\n\t\t}\n\n\t\tconst report = await this.syncEngine.scan(mode);\n\t\tthis.pluginSettings.lastScanSummary = report.summary;\n\t\tawait this.saveSettings();\n\n\t\tconst message = report.summary.canceled\n\t\t\t? `检测已暂停：本次处理 ${report.summary.scanned} 篇，进度已保存，可在设置 → Yuque Sync 查看`\n\t\t\t: `检测完成：实际处理 ${report.summary.scanned} 篇，复用缓存 ${report.summary.cached} 篇，远端正文请求 ${report.summary.remoteBodyRequests} 次；结果已更新到设置页`;\n\t\tnew Notice(message);\n\t\tthis.setStatus(message, 5000);\n\t}\n"
          s = s[:start] + replacement + s[end:]
          main.write_text(s)

          styles = Path('styles.css')
          s = styles.read_text()
          s = s.replace('/* Scan modal */', '/* Sync status panel */')
          addition = """\n.yuque-sync-settings-scan-metrics {\n\tmargin-top: var(--size-4-3);\n}\n\n.yuque-sync-settings-actions {\n\tmargin-bottom: var(--size-4-3);\n}\n\n.yuque-sync-settings-table-wrap {\n\tmax-height: min(52vh, 620px);\n\tmargin-bottom: var(--size-4-5);\n}\n\n.yuque-sync-control-busy {\n\tborder-left: 3px solid var(--interactive-accent);\n}\n"""
          if '.yuque-sync-settings-scan-metrics' not in s:
              s += addition
          styles.write_text(s)

          readme = Path('README.md')
          s = readme.read_text()
          anchor = '## 语雀 OpenAPI 主动限流\n'
          note = """## 设置页同步控制中心\n\n同步状态不再通过单独弹窗展示。插件设置页现在直接提供增量检测、完整检测、暂停检测、批量推送未关联文档、状态概览、搜索筛选和文档列表。同步索引会持久化，重启 Obsidian 后仍可在设置页查看当前状态；最近一次扫描摘要也会保留。\n\n"""
          if '## 设置页同步控制中心' not in s:
              if anchor not in s: raise SystemExit('README anchor missing')
              s = s.replace(anchor, note + anchor, 1)
          readme.write_text(s)
          PY
      - run: npm ci
      - run: npm run check
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.ts src/types.ts src/sync-engine.ts src/settings-tab.ts src/sync-settings-panel.ts styles.css README.md
          if git diff --cached --quiet; then
            echo "No integration changes"
            exit 0
          fi
          git commit -m "界面：将同步状态整合到设置页"
          git push
