name: Sync safety lifecycle fix temporary

on:
  push:
    branches: [feat/sync-safety-cancel-tests]
    paths:
      - .github/workflows/sync-safety-lifecycle-fix-temporary.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/sync-safety-cancel-tests
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Harden dispose lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/api-rate-limiter.ts')
          s = path.read_text()
          replacements = [
              ("\t\t\t\t.then(request.resolve, (error: unknown) => {\n\t\t\t\t\tif (this.isRateLimitError(error)) {", "\t\t\t\t.then(request.resolve, (error: unknown) => {\n\t\t\t\t\tif (!this.disposed && this.isRateLimitError(error)) {"),
              ("\tprivate pauseForRateLimit(error: unknown): void {\n\t\tconst now = Date.now();", "\tprivate pauseForRateLimit(error: unknown): void {\n\t\tif (this.disposed) return;\n\t\tconst now = Date.now();"),
              ("\tprivate scheduleWake(waitMs: number): void {\n\t\tconst safeWait = Math.max(20, Math.ceil(waitMs));", "\tprivate scheduleWake(waitMs: number): void {\n\t\tif (this.disposed) return;\n\t\tconst safeWait = Math.max(20, Math.ceil(waitMs));"),
              ("\tprivate schedulePersist(): void {\n\t\tif (this.persistTimer !== null) {", "\tprivate schedulePersist(): void {\n\t\tif (this.disposed || this.persistTimer !== null) {")
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'patch target missing: {old[:80]!r}')
              s = s.replace(old, new, 1)
          path.write_text(s)
          PY
      - run: npm ci
      - run: npm run check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api-rate-limiter.ts
          git commit -m "修复：避免卸载后重新激活限流计时器"
          git push
