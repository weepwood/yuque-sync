name: Apply incremental sync review fixes

on:
  push:
    branches: [feat/incremental-sync-index]

permissions:
  contents: write

concurrency:
  group: apply-incremental-sync-review-fixes
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/incremental-sync-index
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true
      - name: Apply review fixes
        run: node scripts/apply-sync-engine-review-fixes.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run check
      - name: Commit engine fixes
        run: |
          if git diff --quiet -- src/sync-engine.ts; then
            echo "No engine fixes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sync-engine.ts
          git commit -m "性能：减少索引写入并隔离链接基线"
          git push
