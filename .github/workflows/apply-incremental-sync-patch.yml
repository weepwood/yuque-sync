name: Apply incremental sync review fixes

on:
  push:
    branches: [feat/incremental-sync-index]

permissions:
  contents: write

concurrency:
  group: apply-incremental-sync-review-fixes
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/incremental-sync-index
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true
      - name: Apply review fixes
        run: |
          node scripts/apply-sync-engine-review-fixes.mjs
          rm scripts/apply-sync-engine-review-fixes.mjs
          sed -i '/normalizeMarkdownForComparison,/d' main.ts
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: npm run check
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/sync-engine.ts main.ts scripts
          if git diff --cached --quiet; then
            echo "No review fixes needed"
            exit 0
          fi
          git commit -m "性能：完成万级笔记增量同步审查修复"
          git push
