name: Fix dirty unchecked documents temporary

on:
  push:
    branches: [feat/incremental-sync-index]

permissions:
  contents: write

concurrency:
  group: fix-dirty-unchecked-documents
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/incremental-sync-index
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true
      - name: Fix dirty linked document plan
        run: sed -i 's/Boolean(entry.yuqueLink && entry.lastSyncedHash)/Boolean(entry.yuqueLink)/' src/sync-engine.ts
      - run: npm ci
      - run: npm run check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sync-engine.ts
          if git diff --cached --quiet; then
            echo "No fix needed"
            exit 0
          fi
          git commit -m "性能：及时校验已变更的未基线文档"
          git push
